<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>My Video Studio</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <h1>My Video Studio</h1>

  <!-- =========================
       VIDEO SELECT
  ========================== -->

  <input
    type="file"
    id="videoInput"
    accept="video/*"
    style="display:none;"
  >

  <button id="addVideo" type="button">
    Select Video
  </button>

  <video
    id="videoPreview"
    controls
    playsinline
    style="
      display:none;
      width:90%;
      max-width:500px;
      margin:20px auto;
    "
  ></video>


  <!-- =========================
       TRIM CONTROLS
  ========================== -->

  <div id="trimControls" style="display:none;">

    <label for="startTime">
      Start Time (seconds)
    </label>

    <input
      type="number"
      id="startTime"
      value="0"
      min="0"
      step="0.1"
    >

    <label for="endTime">
      End Time (seconds)
    </label>

    <input
      type="number"
      id="endTime"
      value="0"
      min="0"
      step="0.1"
    >
    <!-- TWO PARTS -->

<h2>Combine 2 Parts</h2>

<label for="part1Start">
  Part 1 Start
</label>

<input
  type="number"
  id="part1Start"
  value="0"
  min="0"
  step="0.1"
>

<label for="part1End">
  Part 1 End
</label>

<input
  type="number"
  id="part1End"
  value="10"
  min="0"
  step="0.1"
>

<br><br>

<label for="part2Start">
  Part 2 Start
</label>

<input
  type="number"
  id="part2Start"
  value="20"
  min="0"
  step="0.1"
>

<label for="part2End">
  Part 2 End
</label>

<input
  type="number"
  id="part2End"
  value="30"
  min="0"
  step="0.1"
>

<br><br>

<button
  id="exportTwoParts"
  type="button"
>
  Export Both Parts
</button>

<p id="twoPartsStatus"></p>

<a
  id="downloadTwoParts"
  href="#"
  style="display:none;"
  download="combined-video.webm"
>
  Download Combined Video
</a>
    <button
      id="previewTrim"
      type="button"
    >
      Preview Trim
    </button>

    <button
      id="exportTrim"
      type="button"
    >
      Export Trimmed Video
    </button>

    <p id="exportStatus"></p>

    <a
      id="downloadVideo"
            Export Trimmed Video
    </button>

    <p id="exportStatus"></p>

    <a
      id="downloadVideo"

      href="#"
      style="display:none;"
      download="trimmed-video.mp4"
    >
      Download Video
    </a>

    


  <!-- =========================
       MUSIC CONTROLS
  ========================== -->

  <div
    id="musicControls"
    style="display:block;"
  >

    <h2>Add Music</h2>

    <input
      type="file"
      id="audioInput"
      accept="audio/*"
      style="display:none;"
    >

    <button
      id="addMusic"
      type="button"
    >
      Select Music
    </button>
     <button
  id="previewMusic"
  type="button"
>
  ▶ Preview Music
</button>

<button
  id="stopMusic"
  type="button"
>
  ⏹ Stop Music
</button>
    <p id="musicStatus"></p>

    <label for="musicVolume">
      Music Volume
    </label>

    <input
      type="range"
      id="musicVolume"
      min="0"
      max="1"
      step="0.05"
      value="0.5"
    >

    <span id="musicVolumeValue">
      50%
    </span>
    <label>
  <input
    type="checkbox"
    id="muteOriginalAudio"
  >
  Mute Original Video Audio
</label>
    <button
      id="exportMusic"
      type="button"
    >
      Export Video With Music
    </button>

    <a
      id="downloadMusic"
      href="#"
      style="display:none;"
      download="video-with-music.mp4"
    >
      Download Video With Music
    </a>

  </div>


  <!-- =========================
       SCRIPT
  ========================== -->
  
<script src="script.js"></script>

</body>
</html>
