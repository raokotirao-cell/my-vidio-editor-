<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>My Video Studio</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <h1>My Video Studio</h1>

  <input
    type="file"
    id="videoInput"
    accept="video/*"
    style="display:none;"
  >

  <button id="addVideo">Select Video</button>

  <video
    id="videoPreview"
    controls
    style="display:none; width:90%; max-width:500px; margin:20px auto;"
  ></video>

  <div id="trimControls" style="display:none;">

    <label>Start Time (seconds)</label>
    <input
      type="number"
      id="startTime"
      value="0"
      min="0"
      step="0.1"
    >

    <label>End Time (seconds)</label>
    <input
      type="number"
      id="endTime"
      value="0"
      min="0"
      step="0.1"
    >

    <button id="previewTrim">Preview Trim</button>
<button id="exportTrim">Export Trimmed Video</button>

<p id="exportStatus"></p>
<a id="downloadVideo" style="display:none;">
  Download Video
</a>
  </div>
  <script
 src="https://cdn.jsdelivr.net/npm/@ffmpeg/util@0.12.1/dist/umd/index.js"></script>
<script src="script.js"></script>

  <script type="module" src="script.js"></script>

</body>
</html>
