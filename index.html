<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>My Video Studio</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <h1>My Video Studio</h1>

  <!-- =========================
       VIDEO SELECT
  ========================== -->

  <input
    type="file"
    id="videoInput"
    accept="video/*"
    style="display:none;"
  >

  <button
    id="addVideo"
    type="button"
  >
    Select Video
  </button>


  <!-- =========================
       VIDEO PREVIEW
  ========================== -->

  <video
    id="videoPreview"
    controls
    playsinline
    style="
      display:none;
      width:90%;
      max-width:500px;
      margin:20px auto;
    "
  ></video>


  <!-- =========================
       TRIM CONTROLS
  ========================== -->

  <div
    id="trimControls"
    style="display:none;"
  >

    <div>
      <label for="startTime">
        Start Time (seconds)
      </label>

      <input
        type="number"
        id="startTime"
        value="0"
        min="0"
        step="0.1"
      >
    </div>


    <div>
      <label for="endTime">
        End Time (seconds)
      </label>

      <input
        type="number"
        id="endTime"
        value="0"
        min="0"
        step="0.1"
      >
    </div>


    <!-- =========================
         PREVIEW BUTTON
    ========================== -->

    <button
      id="previewTrim"
      type="button"
    >
      Preview Trim
    </button>


    <!-- =========================
         EXPORT BUTTON
    ========================== -->

    <button
      id="exportTrim"
      type="button"
    >
      Export Trimmed Video
    </button>


    <!-- =========================
         STATUS
    ========================== -->

    <p id="exportStatus"></p>


    <!-- =========================
         DOWNLOAD
    ========================== -->

    <a
      id="downloadVideo"
      href="#"
      style="display:none;"
      download="trimmed-video.mp4"
    >
      Download Video
    </a>

  </div>


  <!-- =========================
       JAVASCRIPT
  ========================== -->

  <script src="script.js"></script>

</body>
</html>
